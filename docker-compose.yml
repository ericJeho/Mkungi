# Local, all-in-Docker run with jobs and files on a volume.
# Production uses Supabase + Vercel instead; see docs/DEPLOYMENT.md.
services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      MKUNGI_CORS_ORIGINS: '["http://localhost:3000"]'
      # To use a Supabase project instead of the volume, set:
      # MKUNGI_SUPABASE_URL: https://<ref>.supabase.co
      # MKUNGI_SUPABASE_SECRET_KEY: sb_secret_...
    volumes: ["mkungi-data:/data"]

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  mkungi-data:
